```html
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT Dashboard - REST API</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 25px;
      font-size: 28px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card .label {
      font-size: 14px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .card .value {
      font-size: 42px;
      font-weight: bold;
      margin: 10px 0;
      color: #667eea;
    }

    .card .unit {
      font-size: 18px;
      color: #aaa;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
    }

    .status-online {
      background: #d4edda;
      color: #155724;
    }

    .status-offline {
      background: #f8d7da;
      color: #721c24;
    }

    .panel {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      margin-bottom: 25px;
    }

    .panel h2 {
      font-size: 18px;
      margin-bottom: 15px;
      color: #444;
    }

    .chart-container {
      position: relative;
      width: 100%;
      height: 320px;
    }

    .controls {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 30px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-on {
      background: #28a745;
      color: white;
    }

    .btn-on:hover {
      background: #218838;
    }

    .btn-off {
      background: #dc3545;
      color: white;
    }

    .btn-off:hover {
      background: #c82333;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    th {
      background: #f8f9fa;
      color: #666;
      text-transform: uppercase;
      font-size: 12px;
    }

    tr:hover td {
      background: #f9f9f9;
    }

    #log {
      background: #1e1e1e;
      color: #0f0;
      font-family: monospace;
      padding: 15px;
      border-radius: 10px;
      max-height: 180px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.6;
    }

    #log .error {
      color: #f66;
    }

    #log .info {
      color: #6af;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      h1 {
        font-size: 22px;
      }

      .panel {
        padding: 18px;
      }

      .chart-container {
        height: 260px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>IoT Dashboard — REST API</h1>

  <div class="cards">

    <div class="card">
      <div class="label">Suhu</div>
      <div class="value" id="suhu">--</div>
      <div class="unit">°C</div>
    </div>

    <div class="card">
      <div class="label">Kelembaban</div>
      <div class="value" id="kelembaban">--</div>
      <div class="unit">%</div>
    </div>

    <div class="card">
      <div class="label">Status Sensor</div>
      <div class="value" style="font-size:22px;" id="status">
        <span class="status-badge status-offline" id="status-badge">
          OFFLINE
        </span>
      </div>
    </div>

  </div>

  <div class="panel">
    <h2>Grafik Suhu dan Kelembapan Real-Time</h2>
    <div class="chart-container">
      <canvas id="sensorChart"></canvas>
    </div>
  </div>

  <div class="panel">
    <h2>Kontrol Perangkat</h2>

    <div class="controls">
      <button class="btn btn-on" id="btn-on"
        onclick="kontrol('lamp','on')">
        Nyalakan Lampu
      </button>

      <button class="btn btn-off" id="btn-off"
        onclick="kontrol('lamp','off')">
        Matikan Lampu
      </button>
    </div>
  </div>

  <div class="panel">
    <h2>10 Data Sensor Terakhir</h2>

    <table>
      <thead>
        <tr>
          <th>Waktu</th>
          <th>Suhu (°C)</th>
          <th>Kelembapan (%)</th>
        </tr>
      </thead>

      <tbody id="history-body">
        <tr>
          <td colspan="3" style="text-align:center;color:#999;">
            Loading...
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="panel">
    <h2>Log Aktivitas</h2>
    <div id="log"></div>
  </div>

</div>

<script>

  // ALAMAT API NODE-RED
  const API_BASE = 'http://127.0.0.1:1880/api';

  // ==================================
  // LOG AKTIVITAS
  // ==================================

  function log(msg, type = 'info') {
    const el = document.getElementById('log');
    const time = new Date().toLocaleTimeString();

    const item = document.createElement('div');
    item.className = type;
    item.textContent = `[${time}] ${msg}`;

    el.appendChild(item);

    while (el.children.length > 50) {
      el.removeChild(el.firstChild);
    }

    el.scrollTop = el.scrollHeight;
  }


  // ==================================
  // GRAFIK CHART.JS
  // ==================================

  let sensorChart = null;
  let lastChartTimestamp = null;

  function buatGrafik() {

    const canvas = document.getElementById('sensorChart');

    if (typeof Chart === 'undefined') {
      log('Library Chart.js gagal dimuat. Periksa koneksi internet.', 'error');
      return;
    }

    sensorChart = new Chart(canvas, {
      type: 'line',

      data: {
        labels: [],

        datasets: [
          {
            label: 'Suhu (°C)',
            data: [],
            borderColor: '#667eea',
            backgroundColor: 'rgba(102,126,234,0.15)',
            borderWidth: 3,
            tension: 0.3,
            fill: true,
            yAxisID: 'y'
          },

          {
            label: 'Kelembapan (%)',
            data: [],
            borderColor: '#28a745',
            backgroundColor: 'rgba(40,167,69,0.10)',
            borderWidth: 3,
            tension: 0.3,
            fill: true,
            yAxisID: 'y1'
          }
        ]
      },

      options: {
        responsive: true,
        maintainAspectRatio: false,

        interaction: {
          mode: 'index',
          intersect: false
        },

        plugins: {
          legend: {
            position: 'top'
          },

          tooltip: {
            enabled: true
          }
        },

        scales: {
          x: {
            title: {
              display: true,
              text: 'Waktu'
            }
          },

          y: {
            type: 'linear',
            position: 'left',
            beginAtZero: true,
            title: {
              display: true,
              text: 'Suhu (°C)'
            }
          },

          y1: {
            type: 'linear',
            position: 'right',
            beginAtZero: true,
            min: 0,
            max: 100,
            title: {
              display: true,
              text: 'Kelembapan (%)'
            },

            grid: {
              drawOnChartArea: false
            }
          }
        }
      }
    });

    log('Grafik berhasil dibuat.');
  }


  // ==================================
  // MENAMBAHKAN DATA KE GRAFIK
  // ==================================

  function tambahDataGrafik(data) {

    if (!sensorChart) return;

    if (data.timestamp &&
        data.timestamp === lastChartTimestamp) {
      return;
    }

    const suhu = Number(data.suhu);
    const kelembaban = Number(data.kelembaban);

    if (!Number.isFinite(suhu) ||
        !Number.isFinite(kelembaban)) {
      return;
    }

    const waktu = new Date(
      data.timestamp || data.received || Date.now()
    ).toLocaleTimeString();

    sensorChart.data.labels.push(waktu);
    sensorChart.data.datasets[0].data.push(suhu);
    sensorChart.data.datasets[1].data.push(kelembaban);

    lastChartTimestamp = data.timestamp || null;

    if (sensorChart.data.labels.length > 30) {
      sensorChart.data.labels.shift();

      sensorChart.data.datasets.forEach(dataset => {
        dataset.data.shift();
      });
    }

    sensorChart.update('none');
  }


  // ==================================
  // MENAMPILKAN DATA SENSOR
  // ==================================

  function tampilkanSensor(data) {

    if (!data || data.suhu === undefined ||
        data.kelembaban === undefined) {
      return;
    }

    document.getElementById('suhu').textContent =
      data.suhu;

    document.getElementById('kelembaban').textContent =
      data.kelembaban;

    const badge = document.getElementById('status-badge');

    badge.textContent = 'ONLINE';
    badge.className = 'status-badge status-online';

    tambahDataGrafik(data);
  }


  // ==================================
  // WEBSOCKET REAL-TIME
  // ==================================

  let sensorSocket = null;
  let reconnectTimer = null;

  function hubungkanWebSocket() {

    if (sensorSocket &&
        (sensorSocket.readyState === WebSocket.OPEN ||
         sensorSocket.readyState === WebSocket.CONNECTING)) {
      return;
    }

    log('Menghubungkan ke WebSocket...');

    sensorSocket = new WebSocket(
      'ws://127.0.0.1:1880/ws/sensor'
    );

    sensorSocket.onopen = function() {
      log('WebSocket berhasil terhubung!', 'info');
    };

    sensorSocket.onmessage = function(event) {

      try {
        const data = JSON.parse(event.data);

        log('Data sensor diterima melalui WebSocket.');

        tampilkanSensor(data);

      } catch (err) {
        log('Gagal membaca data WebSocket: ' + err.message, 'error');
      }
    };

    sensorSocket.onerror = function() {
      log('Terjadi kesalahan pada koneksi WebSocket.', 'error');
    };

    sensorSocket.onclose = function() {

      log('WebSocket terputus. Mencoba menghubungkan kembali...', 'error');

      clearTimeout(reconnectTimer);

      reconnectTimer = setTimeout(function() {
        hubungkanWebSocket();
      }, 3000);
    };
  }


  // ==================================
  // MENGAMBIL DATA SUHU DARI REST API
  // ==================================

  async function fetchSensor() {

    try {

      const res = await fetch(`${API_BASE}/suhu`);

      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }

      const json = await res.json();

      if (json.status === 'success' &&
          json.data &&
          json.data.suhu !== null) {

        tampilkanSensor(json.data);

      } else {

        const badge = document.getElementById('status-badge');

        badge.textContent = 'OFFLINE';
        badge.className = 'status-badge status-offline';
      }

    } catch (err) {

      log(`Gagal fetch sensor: ${err.message}`, 'error');

      const badge = document.getElementById('status-badge');

      badge.textContent = 'OFFLINE';
      badge.className = 'status-badge status-offline';
    }
  }


  // ==================================
  // MENGAMBIL RIWAYAT SENSOR SQLITE
  // ==================================

  async function fetchHistory() {

    try {

      const res = await fetch(`${API_BASE}/history`);

      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }

      const json = await res.json();

      const tbody = document.getElementById('history-body');

      if (!json.data || json.data.length === 0) {

        tbody.innerHTML = `
          <tr>
            <td colspan="3" style="text-align:center;color:#999;">
              Belum ada data
            </td>
          </tr>
        `;

        return;
      }

      const rows = json.data.slice(0, 10).map(d => `

        <tr>
          <td>${new Date(d.received).toLocaleTimeString()}</td>
          <td>${d.suhu}</td>
          <td>${d.kelembaban}</td>
        </tr>

      `).join('');

      tbody.innerHTML = rows;

    } catch (err) {

      log(`Gagal fetch history: ${err.message}`, 'error');
    }
  }


  // ==================================
  // KONTROL PERANGKAT / LAMPU
  // ==================================

  async function kontrol(device, action) {

    const tombolOn = document.getElementById('btn-on');
    const tombolOff = document.getElementById('btn-off');

    try {

      tombolOn.disabled = true;
      tombolOff.disabled = true;

      log(`Mengirim perintah: ${device} → ${action}`);

      const res = await fetch(`${API_BASE}/kontrol`, {

        method: 'POST',

        headers: {
          'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
        },

        body: new URLSearchParams({
          device: device,
          action: action
        }).toString()

      });

      const responseText = await res.text();

      let json;

      try {
        json = JSON.parse(responseText);
      } catch {
        throw new Error(`Respons server bukan JSON. HTTP ${res.status}`);
      }

      if (!res.ok) {
        throw new Error(`HTTP ${res.status}: ${json.message || 'Permintaan gagal'}`);
      }

      if (json.status === 'success') {

        log(`Perintah berhasil: ${device} → ${action}`, 'info');

      } else {

        log(`Gagal: ${json.message || 'Perintah ditolak'}`, 'error');
      }

    } catch (err) {

      log(`Error kontrol: ${err.message}`, 'error');

      console.error('Detail error kontrol:', err);

    } finally {

      tombolOn.disabled = false;
      tombolOff.disabled = false;
    }
  }


  // ==================================
  // MENJALANKAN DASHBOARD
  // ==================================

  buatGrafik();

  log('Dashboard dimulai.');

  hubungkanWebSocket();

  fetchSensor();
  fetchHistory();

  setInterval(fetchSensor, 3000);
  setInterval(fetchHistory, 5000);

</script>

</body>
</html>
